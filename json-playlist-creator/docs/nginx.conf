# JSON Playlist Creator: nginx rules. Put these inside your site's "server { … }" block (before its PHP location),
# and replace /playlist with the folder you installed to ("" when it is the site root). Then: nginx -t && nginx -s reload
#
# Your PHP setup (fastcgi_pass to php-fpm) stays as it is; these only close private files and map media URLs.

# Private folders and files: code, data (catalog, logins, backups), tools, docs sources, hidden files.
location ~ ^/playlist/(app|data|tools)(/|$)      { return 404; }
location ~ ^/playlist/(.*/)?\.                    { return 404; }
location ~ ^/playlist/(router\.php|.*\.md)$       { return 404; }
# Nothing uploaded can ever run as code.
location ~ ^/playlist/(media|images)/.*\.(php\d?|phtml|phar)$ { return 404; }

# Media URL forms → stream.php (the query string is kept).
rewrite ^/playlist/(live|movie|series)/([^/]+)/([^/]+)/(\d+)(?:\.(\w+))?$ /playlist/stream.php?type=$1&u=$2&p=$3&id=$4&ext=$5 last;
rewrite ^/playlist/timeshift/([^/]+)/([^/]+)/(\d+)/([^/]+)/(\d+)(?:\.\w+)?$ /playlist/stream.php?type=timeshift&u=$1&p=$2&duration=$3&start=$4&id=$5 last;

# Live segments and uploaded videos: right types, readable by web players.
location ^~ /playlist/media/ {
    types { video/mp2t ts; application/vnd.apple.mpegurl m3u8; video/mp4 mp4 m4v; video/webm webm; video/x-matroska mkv; video/quicktime mov; }
    add_header Access-Control-Allow-Origin *;
}
